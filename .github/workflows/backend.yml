name: Backend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tuition
          POSTGRES_USER: tuition
          POSTGRES_PASSWORD: tuition
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tuition -d tuition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tuitionnetwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tuitionnetwork/pom.xml
      - run: sh mvnw -B clean verify
      - run: docker build -t tuitionnetwork:ci .
      - env:
        DB_PORT: 5433
