name: Backend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tuition
          POSTGRES_USER: tuition
          POSTGRES_PASSWORD: tuition
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tuition -d tuition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tuitionnetwork
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tuitionnetwork/pom.xml
      - run: sh mvnw -B clean verify
        env:
          POSTGRES_PORT: 5433
          POSTGRES_DB: tuition
          JWT_SECRET_BASE64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          NATIONAL_ID_HMAC_KEY_BASE64: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXpBQkNERUY=
          NATIONAL_ID_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - run: docker build -t tuitionnetwork:ci . 
