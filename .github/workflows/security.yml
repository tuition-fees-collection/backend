name: DevSecOps Deep Security & DefectDojo Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-scans:
    name: Run Security Scans & Import to DefectDojo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # STEP 1: Secret Scanning (TruffleHog)
      # ==========================================
      - name: TruffleHog Secret Scan
        run: |
          docker run --rm -v "$(pwd):/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --json > trufflehog-results.json || true

      # ==========================================
      # STEP 2: SAST (Semgrep)
      # ==========================================
      - name: Semgrep SAST Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config "p/java" --config "p/security-audit" --json --output semgrep-results.json || true

      # ==========================================
      # STEP 3: Generate CycloneDX SBOM
      # ==========================================
      - name: Generate CycloneDX SBOM
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DschemaVersion=1.5 -Dcyclonedx.outputFormat=json || true
          # Search for bom.json if created in subdirectories
          find . -name "bom.json" -exec cp {} ./bom.json \; || true

      # ==========================================
      # STEP 4: SCA Scan (Trivy)
      # ==========================================
      - name: Trivy SCA Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln --skip-db-update --format json --output trivy-results.json . || true

      # ==========================================
      # STEP 5: Import Results to DefectDojo
      # ==========================================

      # 5.1 Import TruffleHog
      - name: Import TruffleHog Results to DefectDojo
        if: always()
        run: |
          if [ -f "trufflehog-results.json" ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Trufflehog Scan" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "file=@trufflehog-results.json" || true
          fi

      # 5.2 Import Semgrep
      - name: Import Semgrep Results to DefectDojo
        if: always()
        run: |
          if [ -f "semgrep-results.json" ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Semgrep JSON Report" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "file=@semgrep-results.json" || true
          fi

      # 5.3 Import SBOM
      - name: Import SBOM to DefectDojo
        if: always()
        run: |
          if [ -f "bom.json" ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=CycloneDX Scan" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "file=@bom.json" || true
          fi

      # 5.4 Import Trivy
      - name: Import Trivy Results to DefectDojo
        if: always()
        run: |
          if [ -f "trivy-results.json" ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Trivy Scan" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "file=@trivy-results.json" || true
          fi

      # ==========================================
      # STEP 6: Save Artifacts
      # ==========================================
      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            trufflehog-results.json
            semgrep-results.json
            bom.json
            trivy-results.json
