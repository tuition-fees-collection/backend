services:
  postgres:
    image: postgres:16
    container_name: tuitionnetwork-postgres
    environment:
      POSTGRES_DB: tuition
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
    ports:
      - "5433:5432"
    volumes:
      - tuitionnetwork-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tuitionnetwork-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tuitionnetwork.dev
      PGADMIN_DEFAULT_PASSWORD: tuition
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    volumes:
      - tuitionnetwork-pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: tuitionnetwork-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tuition
      SPRING_DATASOURCE_USERNAME: tuition
      SPRING_DATASOURCE_PASSWORD: tuition
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tuitionnetwork-postgres-data:
  tuitionnetwork-pgadmin-data:
