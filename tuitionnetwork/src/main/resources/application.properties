spring.application.name=tuitionnetwork

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:tuition}
spring.datasource.username=tuition
spring.datasource.password=tuition

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public,identity,billing,payments,epp,receipts,notifications,reporting,integration,common
spring.flyway.create-schemas=true

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.national-id.hmac-key-base64=${NATIONAL_ID_HMAC_KEY_BASE64}
security.national-id.encryption-key-base64=${NATIONAL_ID_ENCRYPTION_KEY_BASE64}

payments.online-channel-employee-id=22222222-2222-2222-2222-000000000000

bankmock.base-url=${BANKMOCK_BASE_URL:http://localhost:8000}
bankmock.api-key=${BANKMOCK_API_KEY:wit-intern-2026}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
